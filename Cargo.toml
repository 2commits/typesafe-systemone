[package]
name = "typesafe-systemone"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Async Rust client for the TypeSafe System One API (Jev): typed Noul, Choice and Score judgments"
license = "MIT OR Apache-2.0"
repository = "https://github.com/2commits/typesafe-systemone"
documentation = "https://docs.rs/typesafe-systemone"
readme = "README.md"
keywords = ["typesafe", "jev", "system-one", "ai", "classification"]
categories = ["api-bindings", "web-programming::http-client"]

[features]
default = ["rustls"]
rustls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = false

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Product names (TypeSafe, Jev) and JSON keys appear in prose; backticking them reads wrong.
doc_markdown = "allow"
# Private modules with flat re-exports: `client::ClientBuilder` is the natural name.
module_name_repetitions = "allow"
